<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Blood Inventory</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="container mx-auto mt-8 p-4">
        <h1 class="text-3xl font-bold mb-6">Kho Máu</h1>

        <!-- Filter Form -->
        <div class="bg-white shadow-md rounded-lg p-4 mb-6">
            <form th:action="@{/inventory}" method="get">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div>
                        <label for="bloodType" class="block text-sm font-medium text-gray-700 mb-1">Nhóm máu</label>
                        <select name="bloodType" id="bloodType" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">Tất cả nhóm máu</option>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                        </select>
                    </div>
                    <div>
                        <label for="status" class="block text-sm font-medium text-gray-700 mb-1">Trạng thái</label>
                        <select name="status" id="status" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">Tất cả trạng thái</option>
                            <option value="available">Có sẵn</option>
                            <option value="used">Đã sử dụng</option>
                            <option value="expired">Hết hạn</option>
                        </select>
                    </div>
                    <div class="flex items-end">
                        <button type="submit" class="w-full bg-blue-500 text-white px-6 py-2 rounded-lg hover:bg-blue-600">
                            Lọc
                        </button>
                    </div>
                    <div class="flex items-end">
                        <a href="/inventory" class="w-full text-center bg-gray-200 text-gray-700 px-6 py-2 rounded-lg hover:bg-gray-300">
                            Xóa bộ lọc
                        </a>
                    </div>
                </div>
            </form>
        </div>

        <!-- Results Table -->
        <div class="bg-white shadow-md rounded-lg overflow-x-auto">
            <table class="min-w-full leading-normal">
                <thead>
                    <tr class="bg-gray-200 text-gray-600 uppercase text-sm leading-normal">
                        <th class="py-3 px-6 text-left">Mã đơn vị</th>
                        <th class="py-3 px-6 text-center">Nhóm máu</th>
                        <th class="py-3 px-6 text-center">RH</th>
                        <th class="py-3 px-6 text-center">Dung tích (L)</th>
                        <th class="py-3 px-6 text-left">Ngày hiến</th>
                        <th class="py-3 px-6 text-left">Ngày hết hạn</th>
                        <th class="py-3 px-6 text-center">Trạng thái</th>
                        <th class="py-3 px-6 text-left">Mã ngân hàng</th>
                    </tr>
                </thead>
                <tbody class="text-gray-600 text-sm font-light">
                    <tr th:each="item : ${inventory}" class="border-b border-gray-200 hover:bg-gray-100">
                        <td class="py-3 px-6 text-left">
                            <span class="font-semibold text-blue-600" th:text="${item.unitId}"></span>
                        </td>
                        <td class="py-3 px-6 text-center">
                            <span class="py-1 px-3 rounded-full text-sm font-bold bg-red-100 text-red-700"
                                  th:text="${item.bloodType}"></span>
                        </td>
                        <td class="py-3 px-6 text-center">
                            <span class="py-1 px-2 rounded text-xs font-semibold"
                                  th:classappend="${item.rh == '+' ? 'bg-blue-100 text-blue-700' : 'bg-gray-100 text-gray-700'}"
                                  th:text="${item.rh}"></span>
                        </td>
                        <td class="py-3 px-6 text-center font-medium" th:text="${item.volumeLitter} + ' L'"></td>
                        <td class="py-3 px-6 text-left" th:text="${item.donatedDate}"></td>
                        <td class="py-3 px-6 text-left" th:text="${item.expiredDate}"></td>
                        <td class="py-3 px-6 text-center">
                            <span class="py-1 px-3 rounded-full text-xs font-semibold"
                                  th:classappend="${item.status == 'available' ? 'bg-green-200 text-green-700' : (item.status == 'used' ? 'bg-yellow-200 text-yellow-700' : 'bg-red-200 text-red-700')}"
                                  th:text="${item.status == 'available' ? 'Có sẵn' : (item.status == 'used' ? 'Đã dùng' : 'Hết hạn')}"></span>
                        </td>
                        <td class="py-3 px-6 text-left" th:text="${item.bankId}"></td>
                    </tr>
                </tbody>
            </table>
            
            <!-- No Results Message -->
            <div th:if="${#lists.isEmpty(inventory)}" class="text-center py-8 text-gray-500">
                <p class="text-lg">Không tìm thấy đơn vị máu nào.</p>
            </div>
        </div>
    </div>
</body>
</html>
