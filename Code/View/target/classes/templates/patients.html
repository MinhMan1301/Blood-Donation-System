<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Patients</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="container mx-auto mt-8 p-4">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold">Patients List</h1>
            <form th:action="@{/patients}" method="get" class="flex items-center">
                <input type="text" name="search" placeholder="Search by name..." 
                       class="px-4 py-2 border rounded-l-lg focus:outline-none" th:value="${searchQuery}"/>
                <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded-r-lg hover:bg-blue-600">Search</button>
            </form>
        </div>

        <div class="bg-white shadow-md rounded-lg overflow-x-auto">
            <table class="min-w-full leading-normal">
                <thead>
                    <tr class="bg-gray-200 text-gray-600 uppercase text-sm leading-normal">
                        <th class="py-3 px-6 text-left">ID</th>
                        <th class="py-3 px-6 text-left">Full Name</th>
                        <th class="py-3 px-6 text-left">Email</th>
                        <th class="py-3 px-6 text-center">Gender</th>
                        <th class="py-3 px-6 text-center">Age</th>
                        <th class="py-3 px-6 text-center">Status</th>
                        <th class="py-3 px-6 text-center">Actions</th>
                    </tr>
                </thead>
                <tbody class="text-gray-600 text-sm font-light">
                    <tr th:each="patient : ${patients}" class="border-b border-gray-200 hover:bg-gray-100">
                        <td class="py-3 px-6 text-left whitespace-nowrap" th:text="${patient.patientId}"></td>
                        <td class="py-3 px-6 text-left" th:text="${patient.fullName}"></td>
                        <td class="py-3 px-6 text-left" th:text="${patient.email}"></td>
                        <td class="py-3 px-6 text-center" th:text="${patient.gender}"></td>
                        <td class="py-3 px-6 text-center" th:text="${patient.age}"></td>
                        <td class="py-3 px-6 text-center">
                            <span class="bg-purple-200 text-purple-600 py-1 px-3 rounded-full text-xs" th:text="${patient.status}"></span>
                        </td>
                        <td class="py-3 px-6 text-center">
                            <a th:href="@{/patients/{id}(id=${patient.patientId})}" class="bg-blue-500 text-white py-1 px-3 rounded-full text-xs">View</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
