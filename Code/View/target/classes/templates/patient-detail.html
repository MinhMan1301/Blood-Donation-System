<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Patient Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="container mx-auto mt-8 p-4">
        <a href="/patients" class="text-blue-500 hover:underline mb-4 inline-block">&larr; Back to Patients List</a>
        <div class="bg-white shadow-md rounded-lg p-6">
            <h1 class="text-3xl font-bold mb-4" th:text="${patient.fullName}"></h1>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div><strong>Patient ID:</strong> <span th:text="${patient.patientId}"></span></div>
                <div><strong>SSN:</strong> <span th:text="${patient.ssn}"></span></div>
                <div><strong>Email:</strong> <span th:text="${patient.email}"></span></div>
                <div><strong>Phone:</strong> <span th:text="${patient.phone}"></span></div>
                <div><strong>Gender:</strong> <span th:text="${patient.gender}"></span></div>
                <div><strong>Age:</strong> <span th:text="${patient.age}"></span></div>
                <div><strong>Date of Birth:</strong> <span th:text="${patient.dateOfBirth}"></span></div>
                <div><strong>Status:</strong> <span class="bg-purple-200 text-purple-600 py-1 px-3 rounded-full text-xs" th:text="${patient.status}"></span></div>
                <div><strong>Last Donation Date:</strong> <span th:text="${patient.donationDate}"></span></div>
            </div>
        </div>
    </div>
</body>
</html>
