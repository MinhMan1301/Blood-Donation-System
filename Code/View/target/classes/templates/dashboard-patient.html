<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Patient Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="container mx-auto mt-8 p-4">
        <h1 class="text-3xl font-bold mb-4">Patient Dashboard</h1>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <div class="bg-white p-4 shadow rounded">
                <h2 class="text-xl font-bold">Total Donors</h2>
                <p class="text-2xl" th:text="${totalDonors}"></p>
            </div>
            <div class="bg-white p-4 shadow rounded">
                <h2 class="text-xl font-bold">Total Blood Banks</h2>
                <p class="text-2xl" th:text="${totalBloodBanks}"></p>
            </div>
            <div class="bg-white p-4 shadow rounded">
                <h2 class="text-xl font-bold">Total Blood Units</h2>
                <p class="text-2xl" th:text="${totalBloodUnits}"></p>
            </div>
        </div>

        <!-- My Recent Requests -->
        <div class="mt-8">
            <h2 class="text-2xl font-bold mb-4">My Recent Requests</h2>
            <div class="bg-white shadow-md rounded-lg overflow-x-auto">
                <table class="min-w-full leading-normal">
                    <thead>
                        <tr class="bg-gray-200 text-gray-600 uppercase text-sm leading-normal">
                            <th class="py-3 px-6 text-left">Request ID</th>
                            <th class="py-3 px-6 text-center">Blood Type</th>
                            <th class="py-3 px-6 text-center">Quantity</th>
                            <th class="py-3 px-6 text-center">Status</th>
                            <th class="py-3 px-6 text-left">Request Date</th>
                        </tr>
                    </thead>
                    <tbody class="text-gray-600 text-sm font-light">
                        <tr th:each="request : ${patientRequests}" class="border-b border-gray-200 hover:bg-gray-100">
                            <td class="py-3 px-6 text-left" th:text="${request.requestId}"></td>
                            <td class="py-3 px-6 text-center" th:text="${request.bloodType}"></td>
                            <td class="py-3 px-6 text-center" th:text="${request.quantity}"></td>
                            <td class="py-3 px-6 text-center">
                                <span class="py-1 px-3 rounded-full text-xs"
                                      th:classappend="${request.status == 'Approved' ? 'bg-green-200 text-green-600' : (request.status == 'Pending' ? 'bg-yellow-200 text-yellow-600' : (request.status == 'Fulfilled' ? 'bg-blue-200 text-blue-600' : 'bg-red-200 text-red-600'))}"
                                      th:text="${request.status}"></span>
                            </td>
                            <td class="py-3 px-6 text-left" th:text="${#temporals.format(request.dateRequest, 'yyyy-MM-dd')}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
