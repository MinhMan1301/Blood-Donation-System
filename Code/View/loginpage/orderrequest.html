<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Blood Request - Blood Bank Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        /* CSS cho Sidebar và Tông màu */
        body { font-family: 'Roboto', sans-serif; background-color: #f7f7f7; }
        h1, h2, h3 { font-family: 'Poppins', sans-serif; }
        .sidebar { width: 250px; background-color: #ffffff; box-shadow: 2px 0 10px rgba(0, 0, 0, 0.05); }
        .sidebar-active-link { background-color: #dc2626; color: white; border-left: 4px solid #dc2626; }
        .sidebar-link:hover { background-color: #fef2f2; color: #dc2626; }
        .sidebar-active-link:hover { background-color: #b91c1c; }
        .main-content-area { min-height: calc(100vh - 4rem); }
    </style>
</head>
<body>

<div class="flex h-screen">

    <div class="sidebar flex flex-col justify-between fixed h-full z-10">
        <div>
            <div class="p-6">
                <div class="flex items-center gap-2 text-2xl font-bold text-red-600"><span class="text-3xl">🩸</span>Blood Bank</div>
                <p class="text-xs text-gray-500 mt-1">Management System</p>
            </div>
            <nav class="space-y-1 p-3">
                <a href="#" class="sidebar-link flex items-center gap-3 p-3 rounded-lg text-gray-600 hover:text-red-600 text-sm font-medium transition-colors"><i class="fas fa-tachometer-alt w-5 h-5"></i>Dashboard</a>
                <a href="#" class="sidebar-link flex items-center gap-3 p-3 rounded-lg text-gray-600 hover:text-red-600 text-sm font-medium transition-colors"><i class="fas fa-warehouse w-5 h-5"></i>Blood Inventory</a>
                <a href="#" class="sidebar-link flex items-center gap-3 p-3 rounded-lg text-gray-600 hover:text-red-600 text-sm font-medium transition-colors"><i class="fas fa-users w-5 h-5"></i>Donors</a>
                <a href="#" class="sidebar-link flex items-center gap-3 p-3 rounded-lg text-gray-600 hover:text-red-600 text-sm font-medium transition-colors"><i class="fas fa-user-injured w-5 h-5"></i>Patients</a>
                <a href="#" class="sidebar-link flex items-center gap-3 p-3 rounded-lg text-gray-600 hover:text-red-600 text-sm font-medium transition-colors"><i class="fas fa-user-md w-5 h-5"></i>Doctors</a>
                <a href="#" class="sidebar-link flex items-center gap-3 p-3 rounded-lg text-gray-600 hover:text-red-600 text-sm font-medium transition-colors"><i class="fas fa-university w-5 h-5"></i>Blood Banks</a>
                <a href="#" class="sidebar-link sidebar-active-link flex items-center gap-3 p-3 rounded-lg text-sm font-medium transition-colors"><i class="fas fa-file-invoice w-5 h-5"></i>Requests</a>
                <a href="#" class="sidebar-link flex items-center gap-3 p-3 rounded-lg text-gray-600 hover:text-red-600 text-sm font-medium transition-colors"><i class="fas fa-calendar-alt w-5 h-5"></i>Events</a>
            </nav>
        </div>
        <div class="p-6 text-xs text-gray-400 border-t border-gray-100">Blood Donation Center V1.0</div>
    </div>

    <div class="flex-1 ml-[250px] p-8 main-content-area">
        <div class="flex justify-end mb-6 text-sm text-gray-500">Saturday, November 15, 2025</div>

        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-extrabold text-gray-800">New Blood Request</h1>
                <p class="text-gray-500 mt-1">Fill in the details to submit a new blood unit request.</p>
            </div>
            <a href="#requests-list" class="text-red-600 border border-red-600 px-6 py-3 rounded-xl hover:bg-red-50 transition-all duration-300 font-semibold flex items-center gap-2">
                <i class="fas fa-arrow-left"></i>
                Back to Requests List
            </a>
        </div>

        <div class="bg-white p-8 rounded-xl shadow-lg">
            <h2 class="text-xl font-semibold text-gray-800 mb-6 border-b pb-3">Request Details</h2>
            
            <form action="#" method="POST" class="space-y-6">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="patient-id" class="block text-sm font-medium text-gray-700 mb-2">Patient ID <span class="text-red-600">*</span></label>
                        <input type="text" id="patient-id" name="patient_id" placeholder="e.g., PT-00123" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-red-500 focus:border-red-500 transition-all">
                    </div>
                    
                    <div>
                        <label for="request-source" class="block text-sm font-medium text-gray-700 mb-2">Request Source Type <span class="text-red-600">*</span></label>
                        <div class="relative">
                            <select id="request-source" name="request_source" required class="block w-full appearance-none bg-white border border-gray-300 py-3 pl-4 pr-8 rounded-lg leading-tight focus:outline-none focus:bg-white focus:border-red-500 transition-all">
                                <option value="" disabled selected>Select source</option>
                                <option>Doctor</option>
                                <option>Patient</option>
                                <option>Donor</option>
                                <option>Staff</option>
                                <option>Blood Bank</option>
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-700">
                                <i class="fas fa-chevron-down text-sm"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="units" class="block text-sm font-medium text-gray-700 mb-2">Number of Units (L) <span class="text-red-600">*</span></label>
                        <input type="number" id="units" name="units" placeholder="e.g., 2" min="1" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-red-500 focus:border-red-500 transition-all">
                    </div>
                    
                    <div>
                        <label for="urgency" class="block text-sm font-medium text-gray-700 mb-2">Urgency Level <span class="text-red-600">*</span></label>
                        <div class="relative">
                            <select id="urgency" name="urgency" required class="block w-full appearance-none bg-white border border-gray-300 py-3 pl-4 pr-8 rounded-lg leading-tight focus:outline-none focus:bg-white focus:border-red-500 transition-all">
                                <option value="" disabled selected>Select urgency</option>
                                <option>Normal</option>
                                <option>Urgent (Within 24h)</option>
                                <option>Critical (Immediate)</option>
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-700">
                                <i class="fas fa-chevron-down text-sm"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="blood-type" class="block text-sm font-medium text-gray-700 mb-2">Required Blood Type <span class="text-red-600">*</span></label>
                        <div class="relative">
                            <select id="blood-type" name="blood_type" required class="block w-full appearance-none bg-white border border-gray-300 py-3 pl-4 pr-8 rounded-lg leading-tight focus:outline-none focus:bg-white focus:border-red-500 transition-all">
                                <option value="" disabled selected>Select blood type</option>
                                <option>A+</option>
                                <option>A-</option>
                                <option>B+</option>
                                <option>B-</option>
                                <option>O+</option>
                                <option>O-</option>
                                <option>AB+</option>
                                <option>AB-</option>
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-700">
                                <i class="fas fa-chevron-down text-sm"></i>
                            </div>
                        </div>
                    </div>
                    <div>
                        <label for="doctor-id" class="block text-sm font-medium text-gray-700 mb-2">Assigned Doctor ID/Name</label>
                        <input type="text" id="doctor-id" name="doctor_id" placeholder="e.g., DR-005 - Dr. A. Smith" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-red-500 focus:border-red-500 transition-all">
                    </div>
                </div>

                <div>
                    <label for="notes" class="block text-sm font-medium text-gray-700 mb-2">Notes/Reason for Request</label>
                    <textarea id="notes" name="notes" rows="3" placeholder="Enter clinical notes or reason for this request..." class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-red-500 focus:border-red-500 transition-all"></textarea>
                </div>

                <div class="pt-4 border-t mt-6">
                    <button type="submit" class="w-full bg-red-600 text-white px-6 py-3 rounded-xl hover:bg-red-700 transition-all duration-300 shadow-lg font-semibold flex items-center justify-center gap-3">
                        <i class="fas fa-paper-plane"></i>
                        Submit Blood Request
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
