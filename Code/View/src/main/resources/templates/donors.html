<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Donors</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="container mx-auto mt-8 p-4">
        <h1 class="text-3xl font-bold mb-6">Danh Sách Người Hiến Máu</h1>
        
        <!-- Search and Filter Section -->
        <div class="bg-white shadow-md rounded-lg p-4 mb-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Search by Name -->
                <form th:action="@{/donors}" method="get" class="flex items-center">
                    <input type="text" name="search" placeholder="Tìm kiếm theo tên..." 
                           class="flex-1 px-4 py-2 border rounded-l-lg focus:outline-none focus:ring-2 focus:ring-blue-500" 
                           th:value="${searchQuery}"/>
                    <button type="submit" class="bg-blue-500 text-white px-6 py-2 rounded-r-lg hover:bg-blue-600">
                        Tìm kiếm
                    </button>
                </form>
                
                <!-- Filter by Gender -->
                <form th:action="@{/donors}" method="get" class="flex items-center">
                    <select name="gender" class="flex-1 px-4 py-2 border rounded-l-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="">Tất cả giới tính</option>
                        <option value="Male" th:selected="${genderFilter == 'Male'}">Nam</option>
                        <option value="Female" th:selected="${genderFilter == 'Female'}">Nữ</option>
                    </select>
                    <button type="submit" class="bg-green-500 text-white px-6 py-2 rounded-r-lg hover:bg-green-600">
                        Lọc
                    </button>
                </form>
            </div>
            
            <!-- Clear Filters -->
            <div class="mt-3 text-center" th:if="${searchQuery != null or genderFilter != null}">
                <a href="/donors" class="text-gray-600 hover:text-gray-800 underline">
                    Xóa bộ lọc
                </a>
            </div>
        </div>

        <!-- Results Table -->
        <div class="bg-white shadow-md rounded-lg overflow-x-auto">
            <table class="min-w-full leading-normal">
                <thead>
                    <tr class="bg-gray-200 text-gray-600 uppercase text-sm leading-normal">
                        <th class="py-3 px-6 text-left">Mã số</th>
                        <th class="py-3 px-6 text-left">Họ và tên</th>
                        <th class="py-3 px-6 text-left">Email</th>
                        <th class="py-3 px-6 text-left">Số điện thoại</th>
                        <th class="py-3 px-6 text-center">Giới tính</th>
                        <th class="py-3 px-6 text-center">Tuổi</th>
                        <th class="py-3 px-6 text-left">Lần hiến cuối</th>
                    </tr>
                </thead>
                <tbody class="text-gray-600 text-sm font-light">
                    <tr th:each="donor : ${donors}" class="border-b border-gray-200 hover:bg-gray-100">
                        <td class="py-3 px-6 text-left whitespace-nowrap">
                            <span class="font-semibold text-blue-600" th:text="${donor.donorsId}"></span>
                        </td>
                        <td class="py-3 px-6 text-left font-medium" th:text="${donor.fullName}"></td>
                        <td class="py-3 px-6 text-left" th:text="${donor.email}"></td>
                        <td class="py-3 px-6 text-left" th:text="${donor.phone}"></td>
                        <td class="py-3 px-6 text-center">
                            <span class="py-1 px-3 rounded-full text-xs font-semibold"
                                  th:classappend="${donor.gender == 'Male' ? 'bg-blue-200 text-blue-800' : 'bg-pink-200 text-pink-800'}"
                                  th:text="${donor.gender == 'Male' ? 'Nam' : 'Nữ'}"></span>
                        </td>
                        <td class="py-3 px-6 text-center" th:text="${donor.age}"></td>
                        <td class="py-3 px-6 text-left">
                            <span th:if="${donor.lastDonationDate != null}" th:text="${donor.lastDonationDate}"></span>
                            <span th:if="${donor.lastDonationDate == null}" class="text-gray-400 italic">Chưa hiến</span>
                        </td>
                    </tr>
                </tbody>
            </table>
            
            <!-- No Results Message -->
            <div th:if="${#lists.isEmpty(donors)}" class="text-center py-8 text-gray-500">
                <p class="text-lg">Không tìm thấy người hiến máu nào.</p>
            </div>
        </div>
    </div>
</body>
</html>
