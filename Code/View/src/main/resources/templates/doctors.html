<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Doctors</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="container mx-auto mt-8 p-4">
        <h1 class="text-3xl font-bold mb-6">Danh Sách Bác Sĩ</h1>
        
        <!-- Search Section -->
        <div class="bg-white shadow-md rounded-lg p-4 mb-6">
            <form th:action="@{/doctors}" method="get">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="md:col-span-2">
                        <input type="text" name="search" placeholder="Nhập từ khóa tìm kiếm..." 
                               class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" 
                               th:value="${searchQuery}"/>
                    </div>
                    <div class="flex gap-2">
                        <select name="searchType" class="flex-1 px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="name" th:selected="${searchType == 'name' or searchType == null}">Tìm theo tên</option>
                            <option value="specialty" th:selected="${searchType == 'specialty'}">Tìm theo chuyên khoa</option>
                        </select>
                        <button type="submit" class="bg-blue-500 text-white px-6 py-2 rounded-lg hover:bg-blue-600 whitespace-nowrap">
                            Tìm kiếm
                        </button>
                    </div>
                </div>
                
                <!-- Clear Filters -->
                <div class="mt-3 text-center" th:if="${searchQuery != null}">
                    <a href="/doctors" class="text-gray-600 hover:text-gray-800 underline">
                        Xóa bộ lọc
                    </a>
                </div>
            </form>
        </div>

        <!-- Results Table -->
        <div class="bg-white shadow-md rounded-lg overflow-x-auto">
            <table class="min-w-full leading-normal">
                <thead>
                    <tr class="bg-gray-200 text-gray-600 uppercase text-sm leading-normal">
                        <th class="py-3 px-6 text-left">Mã số</th>
                        <th class="py-3 px-6 text-left">Họ và tên</th>
                        <th class="py-3 px-6 text-left">Email</th>
                        <th class="py-3 px-6 text-left">Số điện thoại</th>
                        <th class="py-3 px-6 text-left">Chuyên khoa</th>
                        <th class="py-3 px-6 text-center">Thao tác</th>
                    </tr>
                </thead>
                <tbody class="text-gray-600 text-sm font-light">
                    <tr th:each="doctor : ${doctors}" class="border-b border-gray-200 hover:bg-gray-100">
                        <td class="py-3 px-6 text-left whitespace-nowrap">
                            <span class="font-semibold text-blue-600" th:text="${doctor.doctorId}"></span>
                        </td>
                        <td class="py-3 px-6 text-left font-medium" th:text="${doctor.fullName}"></td>
                        <td class="py-3 px-6 text-left" th:text="${doctor.email}"></td>
                        <td class="py-3 px-6 text-left" th:text="${doctor.phone}"></td>
                        <td class="py-3 px-6 text-left">
                            <span class="py-1 px-3 rounded-full text-xs font-semibold bg-purple-200 text-purple-800"
                                  th:text="${doctor.specialization}"></span>
                        </td>
                        <td class="py-3 px-6 text-center">
                            <a th:href="@{/doctors/{id}(id=${doctor.doctorId})}" 
                               class="bg-blue-500 text-white py-1 px-4 rounded-lg text-xs hover:bg-blue-600">
                                Xem chi tiết
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
            
            <!-- No Results Message -->
            <div th:if="${#lists.isEmpty(doctors)}" class="text-center py-8 text-gray-500">
                <p class="text-lg">Không tìm thấy bác sĩ nào.</p>
            </div>
        </div>
    </div>
</body>
</html>
