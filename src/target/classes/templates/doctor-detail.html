<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Doctor Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="container mx-auto mt-8 p-4">
        <a href="/doctors" class="text-blue-500 hover:underline mb-4 inline-block">&larr; Back to Doctors List</a>
        <div class="bg-white shadow-md rounded-lg p-6">
            <h1 class="text-3xl font-bold mb-4" th:text="${doctor.fullName}"></h1>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div><strong>Doctor ID:</strong> <span th:text="${doctor.doctorId}"></span></div>
                <div><strong>SSN:</strong> <span th:text="${doctor.ssn}"></span></div>
                <div><strong>Email:</strong> <span th:text="${doctor.email}"></span></div>
                <div><strong>Phone:</strong> <span th:text="${doctor.phone}"></span></div>
                <div><strong>Specialization:</strong> <span th:text="${doctor.specialization}"></span></div>
            </div>
        </div>
    </div>
</body>
</html>
