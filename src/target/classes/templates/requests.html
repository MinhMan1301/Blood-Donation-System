<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Blood Requests</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="container mx-auto mt-8 p-4">
        <h1 class="text-3xl font-bold mb-6">Blood Requests</h1>

        <!-- Filter Form -->
        <form th:action="@{/requests}" method="get" class="mb-6 flex gap-4 items-center">
            <div>
                <label for="status" class="sr-only">Status</label>
                <select name="status" id="status" class="px-4 py-2 border rounded-lg">
                    <option value="">All Statuses</option>
                    <option value="Pending">Pending</option>
                    <option value="Approved">Approved</option>
                    <option value="Fulfilled">Fulfilled</option>
                    <option value="Rejected">Rejected</option>
                </select>
            </div>
            <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">Filter</button>
            <a href="/requests" class="text-gray-600 hover:underline">Clear Filters</a>
        </form>

        <div class="bg-white shadow-md rounded-lg overflow-x-auto">
            <table class="min-w-full leading-normal">
                <thead>
                    <tr class="bg-gray-200 text-gray-600 uppercase text-sm leading-normal">
                        <th class="py-3 px-6 text-left">Request ID</th>
                        <th class="py-3 px-6 text-center">Blood Type</th>
                        <th class="py-3 px-6 text-center">Quantity</th>
                        <th class="py-3 px-6 text-left">Request Date</th>
                        <th class="py-3 px-6 text-left">Patient ID</th>
                        <th class="py-3 px-6 text-left">Doctor ID</th>
                        <th class="py-3 px-6 text-center">Status</th>
                    </tr>
                </thead>
                <tbody class="text-gray-600 text-sm font-light">
                    <tr th:each="req : ${requests}" class="border-b border-gray-200 hover:bg-gray-100">
                        <td class="py-3 px-6 text-left" th:text="${req.requestId}"></td>
                        <td class="py-3 px-6 text-center" th:text="${req.bloodType}"></td>
                        <td class="py-3 px-6 text-center" th:text="${req.quantity}"></td>
                        <td class="py-3 px-6 text-left" th:text="${req.dateRequest}"></td>
                        <td class="py-3 px-6 text-left" th:text="${req.patientId}"></td>
                        <td class="py-3 px-6 text-left" th:text="${req.doctorId}"></td>
                        <td class="py-3 px-6 text-center">
                            <span class="py-1 px-3 rounded-full text-xs"
                                  th:classappend="${req.status == 'Approved' ? 'bg-green-200 text-green-600' : (req.status == 'Pending' ? 'bg-yellow-200 text-yellow-600' : (req.status == 'Fulfilled' ? 'bg-blue-200 text-blue-600' : 'bg-red-200 text-red-600'))}"
                                  th:text="${req.status}"></span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
