<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Accounts</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="container mx-auto mt-8 p-4">
        <h1 class="text-3xl font-bold mb-6">User Accounts</h1>

        <div class="bg-white shadow-md rounded-lg overflow-x-auto">
            <table class="min-w-full leading-normal">
                <thead>
                    <tr class="bg-gray-200 text-gray-600 uppercase text-sm leading-normal">
                        <th class="py-3 px-6 text-left">Account ID</th>
                        <th class="py-3 px-6 text-left">Email</th>
                        <th class="py-3 px-6 text-center">Role</th>
                        <th class="py-3 px-6 text-center">Status</th>
                        <th class="py-3 px-6 text-left">Created At</th>
                        <th class="py-3 px-6 text-left">Patient/Doctor ID</th>
                    </tr>
                </thead>
                <tbody class="text-gray-600 text-sm font-light">
                    <tr th:each="acc : ${accounts}" class="border-b border-gray-200 hover:bg-gray-100">
                        <td class="py-3 px-6 text-left" th:text="${acc.id}"></td>
                        <td class="py-3 px-6 text-left" th:text="${acc.email}"></td>
                        <td class="py-3 px-6 text-center" th:text="${acc.role}"></td>
                        <td class="py-3 px-6 text-center">
                            <span class="py-1 px-3 rounded-full text-xs"
                                  th:classappend="${acc.isActive ? 'bg-green-200 text-green-600' : 'bg-red-200 text-red-600'}"
                                  th:text="${acc.isActive ? 'Active' : 'Inactive'}"></span>
                        </td>
                        <td class="py-3 px-6 text-left" th:text="${#temporals.format(acc.timeCreated, 'yyyy-MM-dd HH:mm')}"></td>
                        <td class="py-3 px-6 text-left" th:text="${acc.patientId != null ? acc.patientId : acc.doctorId}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
