<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Blood Banks</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="container mx-auto mt-8 p-4">
        <h1 class="text-3xl font-bold mb-6">Danh Sách Ngân Hàng Máu</h1>

        <!-- Search and Filter Section -->
        <div class="bg-white shadow-md rounded-lg p-4 mb-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Search by Name -->
                <form th:action="@{/bloodbanks}" method="get" class="flex items-center">
                    <input type="text" name="search" placeholder="Tìm kiếm theo tên ngân hàng máu..."
                           class="flex-1 px-4 py-2 border rounded-l-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                           th:value="${searchQuery}">
                    <button type="submit"
                            class="px-6 py-2 bg-blue-500 text-white rounded-r-lg hover:bg-blue-600">
                        Tìm kiếm
                    </button>
                </form>
                
                <!-- Filter by Location -->
                <form th:action="@{/bloodbanks}" method="get" class="flex items-center">
                    <input type="text" name="location" placeholder="Lọc theo địa điểm..."
                           class="flex-1 px-4 py-2 border rounded-l-lg focus:outline-none focus:ring-2 focus:ring-green-500"
                           th:value="${locationFilter}">
                    <button type="submit"
                            class="px-6 py-2 bg-green-500 text-white rounded-r-lg hover:bg-green-600">
                        Lọc
                    </button>
                </form>
            </div>
            
            <!-- Clear Filters -->
            <div class="mt-3 text-center" th:if="${searchQuery != null or locationFilter != null}">
                <a href="/bloodbanks" class="text-gray-600 hover:text-gray-800 underline">
                    Xóa bộ lọc
                </a>
            </div>
        </div>

        <!-- Results Table -->
        <div class="bg-white shadow-md rounded-lg overflow-x-auto">
            <table class="min-w-full leading-normal">
                <thead>
                    <tr class="bg-gray-200 text-gray-600 uppercase text-sm leading-normal">
                        <th class="py-3 px-6 text-left">Mã số</th>
                        <th class="py-3 px-6 text-left">Tên ngân hàng</th>
                        <th class="py-3 px-6 text-left">Địa điểm</th>
                        <th class="py-3 px-6 text-left">Email liên hệ</th>
                        <th class="py-3 px-6 text-left">Số điện thoại</th>
                        <th class="py-3 px-6 text-center">Dung tích (L)</th>
                    </tr>
                </thead>
                <tbody class="text-gray-600 text-sm font-light">
                    <tr th:each="bank : ${bloodBanks}" class="border-b border-gray-200 hover:bg-gray-100">
                        <td class="py-3 px-6 text-left whitespace-nowrap">
                            <span class="font-semibold text-blue-600" th:text="${bank.bankId}"></span>
                        </td>
                        <td class="py-3 px-6 text-left font-medium" th:text="${bank.bankName}"></td>
                        <td class="py-3 px-6 text-left">
                            <span class="inline-flex items-center">
                                <svg class="w-4 h-4 mr-1 text-gray-500" fill="currentColor" viewBox="0 0 20 20">
                                    <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"/>
                                </svg>
                                <span th:text="${bank.location}"></span>
                            </span>
                        </td>
                        <td class="py-3 px-6 text-left" th:text="${bank.contactEmail}"></td>
                        <td class="py-3 px-6 text-left" th:text="${bank.contactPhone}"></td>
                        <td class="py-3 px-6 text-center">
                            <span class="py-1 px-3 rounded-full text-xs font-semibold bg-red-200 text-red-800"
                                  th:text="${bank.volume} + ' L'"></span>
                        </td>
                    </tr>
                </tbody>
            </table>
            
            <!-- No Results Message -->
            <div th:if="${#lists.isEmpty(bloodBanks)}" class="text-center py-8 text-gray-500">
                <p class="text-lg">Không tìm thấy ngân hàng máu nào.</p>
            </div>
        </div>
    </div>
</body>
</html>
